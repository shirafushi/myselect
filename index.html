<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>身体の詩</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container" id="container">
  <!-- JavaScriptで段落を生成 -->
</div>

<script>
  const lines = [
    "私が身体を使った表現を行うのは、",
    "単なる露出や裸体の提示ではありません。",
    "身体は、私にとって自己表現のための媒介であり、",
    "自己を深く探求し、",
    "社会的な期待や規範に問いを投げかける感覚の延長です。",
    "カメラで身体を撮る行為や、",
    "写真と物理的オブジェクトを組み合わせることは、",
    "肉体をさらすのではなく、",
    "身体という存在を社会的・文化的な枠組みから捉え直し、",
    "新たな視点を探る試みです。",
    "そのプロセスには、見られること、",
    "見せること、",
    "そしてその間で生まれる",
    "葛藤が常に内在しています。",
    "私の作品が示そうとしているのは、",
    "ただの裸や肉体ではなく、",
    "身体を通して社会やジェンダーに対して問いを立て、",
    "自己を解きほぐし、再編する可能性です。",
    "見られることへの葛藤や、",
    "身体をどう引き受けるかという問いは、",
    "アートの枠を超え、",
    "現代を生きる私たち一人ひとりに",
    "深く関わるテーマだと考えています。"
  ];

  const container = document.getElementById('container');

  lines.forEach(text => {
    const p = document.createElement('p');
    p.textContent = text;

    // 左右位置をランダムに（10%〜70%の範囲で）
    const leftOffset = Math.random() * 60 + 10;
    p.style.left = `${leftOffset}%`;

    container.appendChild(p);
  });

  function revealOnScroll() {
    const paragraphs = document.querySelectorAll('p');
    const windowHeight = window.innerHeight;

    paragraphs.forEach(p => {
      const rect = p.getBoundingClientRect();
      if (rect.top < windowHeight - 50) {
        p.classList.add('visible');
      }
    });
  }

  window.addEventListener('scroll', revealOnScroll);
  window.addEventListener('load', revealOnScroll);
</script>

</body>
</html>
